name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Verify vendored dependencies offline
        run: python3 deps/update_deps.py --check
      - name: Verify the include graph tool runs
        run: python3 -m py_compile tools/check_include_graph.py deps/update_deps.py

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        preset: [ci, ci-sanitize, debug]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: msys2/setup-msys2@40677d36a502eb2cf0fb808cc9dec31bf6152638 # v2.28.0
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-lld mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja mingw-w64-clang-x86_64-pkgconf mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-ccache mingw-w64-clang-x86_64-qt6-base mingw-w64-clang-x86_64-qt6-tools
      - name: Print toolchain versions
        run: clang++ --version && cmake --version && ninja --version && qmake6 -query QT_VERSION
      - name: Verify vendored dependencies
        run: python deps/update_deps.py --check
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build (show every error)
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          MWB_AUDIO_BACKEND: "null"
          MWB_MIDI_BACKEND: "null"
          ASAN_SYMBOLIZER_PATH: /clang64/bin/llvm-symbolizer.exe
        run: ctest --preset ${{ matrix.preset }}
      - name: Install and start with only System32 on PATH
        if: matrix.preset == 'ci'
        run: |
          cmake --install build/ci --prefix "$PWD/stage"
          cmd //c "set PATH=C:\Windows\System32 && set QT_QPA_PLATFORM=offscreen && set MWB_AUDIO_BACKEND=null && set MWB_MIDI_BACKEND=null && stage\mwb-cli.exe capabilities --json && stage\MIDIWorkbench.exe --exit-when-ready --workspace stage\ws"
